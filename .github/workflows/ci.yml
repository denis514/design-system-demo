name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One workflow, two jobs, and the second cannot start unless the first passed.
#
# It used to be two files racing each other on the same push. Both installed, both built, and
# neither knew the other existed — so on 2026-08-16 a token file reached main holding
# `var(--color-color-blue-400)` with no such property declared anywhere, CI caught it and failed,
# and the deploy published the broken stylesheet anyway. A check that catches a fault and does not
# stop it shipping is half a check.
#
# Merged rather than chained with `workflow_run`: that keeps the checks and the artefact in one
# build instead of two, and avoids having to remember that a `workflow_run` job checks out the
# default branch rather than the commit that triggered it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on an undefined $variable or a missing mixin — which is exactly what a renamed or
      # deleted token looks like from here.
      - name: Build
        run: pnpm run build

      # A `var()` with no declaration is valid CSS that silently does nothing at runtime. The
      # build cannot catch it; this can.
      - name: Every custom property referenced is also declared
        run: |
          CSS=$(cat dist/assets/*.css)
          echo "$CSS" | grep -o -- '--[a-z0-9-]*:' | sed 's/://' | sort -u > /tmp/declared.txt
          echo "$CSS" | grep -o 'var(--[a-z0-9-]*)' | sed 's/var(\(.*\))/\1/' | sort -u > /tmp/referenced.txt
          MISSING=$(comm -23 /tmp/referenced.txt /tmp/declared.txt)
          if [ -n "$MISSING" ]; then
            echo "Referenced but never declared:"
            echo "$MISSING"
            exit 1
          fi
          echo "$(wc -l < /tmp/declared.txt) properties declared, all references resolve"

      - name: The responsive type scale survived
        run: grep -q 'min-width:1024px' dist/assets/*.css

      # ---------------------------------------------------------------- what gets published
      #
      # The site is the plugin's own preview page, not the demo above.
      #
      # The demo is written against this design system's token names — 33 variables and 27 mixins
      # by name — so it compiles only for this file and no other. That is exactly what makes it a
      # good *check* and a poor *page*: `pnpm run build` fails the moment a token is renamed, and
      # nothing else in this repository would notice. So it stays, and stops being published.
      #
      # `preview.html` is the opposite: self-contained, no build, and it works on any design system
      # because it is generated from whatever the file holds.
      - name: The preview page has been published
        run: |
          if [ ! -f tokens/preview.html ]; then
            echo "tokens/preview.html is missing."
            echo
            echo "In the plugin, on the Export tab, tick 'Also write a preview page' and publish."
            echo "Until then there is no site to deploy."
            exit 1
          fi

      # The preview inlines its whole stylesheet, so this checks precisely what ships — a stronger
      # reading than the built demo gave, where the same fault could hide in an unused file.
      - name: Every custom property the preview references is also declared
        run: |
          PAGE=$(cat tokens/preview.html)
          echo "$PAGE" | grep -o -- '--[a-z0-9-]*:' | sed 's/://' | sort -u > /tmp/p-declared.txt
          echo "$PAGE" | grep -o 'var(--[a-z0-9-]*)' | sed 's/var(\(.*\))/\1/' | sort -u > /tmp/p-referenced.txt
          MISSING=$(comm -23 /tmp/p-referenced.txt /tmp/p-declared.txt)
          if [ -n "$MISSING" ]; then
            echo "The published page references properties nothing declares:"
            echo "$MISSING"
            exit 1
          fi
          echo "$(wc -l < /tmp/p-declared.txt) properties declared, all references resolve"

      - name: Assemble the site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp tokens/preview.html _site/index.html
          # Served from a subpath, and a page that fetches nothing needs no base tag — but a
          # 404 without one is a confusing way to find that out.
          test -s _site/index.html

      # Only what passed the checks above is ever handed to the deploy job. On a pull request
      # there is nothing to publish, so the upload is skipped and the checks still run.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    # The whole point. `needs` makes publishing structurally impossible when a check failed.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deployment at a time; a queued run supersedes an older one rather than racing it.
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
